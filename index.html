<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Phonetics & Phonology Lab</title>
		<link
			rel="stylesheet"
			href="/css/variables.css"
		/>
		<link
			rel="stylesheet"
			href="/css/navbar.css"
		/>
		<style>
			body {
				font-family: Arial, sans-serif;
				line-height: 1.6;
				margin: 0;
				padding: 20px;
				background-color: #f4f4f4;
				color: var(--text-color);
			}
			.container {
				max-width: 800px;
				margin: auto;
				background: white;
				padding: 20px;
				border-radius: var(--border-radius);
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			}

			.center-block {
				display: block; /* Changes the image from inline to block */
				margin: 0 auto; /* Sets top/bottom margin to 0, left/right to auto */
				max-width: 100%; /* Prevents the image from breaking mobile screens */
				height: auto; /* Keeps the aspect ratio intact */
			}

			h1 {
				color: var(--link-color);
			}

			p {
				font-size: 16px;
			}
		</style>
	</head>

						onclick="

								.querySelector('.navbar-item-container')
								.classList.toggle('show')
						"
					>

				</div>
				<div class="navbar-item-container">

							class="navbar-link"
							href="/people"

						</a>
						<div class="children">
							<a

							<a
